<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sıhana Jorin — Köy Derneği</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#DEDBC8' },
                    fontFamily: { serif: ['"Instrument Serif"', 'serif'] }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * { font-family:'Almarai',-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Oxygen','Ubuntu','Cantarell',sans-serif; }
        body { background:#000; color:#E1E0CC; overflow-x:hidden; margin:0; }
        :root { --foreground:#E1E0CC; --muted:rgba(225,224,204,0.2); --muted-foreground:rgba(225,224,204,0.45); --background:#101010; --border:rgba(225,224,204,0.1); }

        .noise-overlay { position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px 128px; }
        .bg-noise { position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n2'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n2)'/%3E%3C/svg%3E");background-size:128px 128px;pointer-events:none; }
        .nav-link { color:rgba(225,224,204,0.8);transition:color 0.3s ease; }
        .nav-link:hover { color:#E1E0CC; }
        .feature-card { border:1px solid transparent;transition:border-color 0.3s ease,box-shadow 0.3s ease; }
        .feature-card:hover { border-color:rgba(222,219,200,0.2);box-shadow:0 0 30px rgba(222,219,200,0.05); }
        .learn-arrow { transition:transform 0.3s ease; }
        .learn-more-group:hover .learn-arrow { transform:rotate(-45deg) translateX(4px); }
        .word-overflow { overflow:hidden;display:inline-block;vertical-align:bottom;margin-right:0.3em; }

        .toc-scroll::-webkit-scrollbar { width:4px; }
        .toc-scroll::-webkit-scrollbar-track { background:transparent; }
        .toc-scroll::-webkit-scrollbar-thumb { background:rgba(225,224,204,0.15);border-radius:2px; }

        .cookie-enter { animation:cookieUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards; }
        .cookie-exit { animation:cookieDown 0.4s cubic-bezier(0.16,1,0.3,1) forwards; }
        @keyframes cookieUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
        @keyframes cookieDown { from{opacity:1;transform:translateY(0)} to{opacity:0;transform:translateY(30px)} }

        .island-enter { animation:islandUp 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards; }
        @keyframes islandUp { from{opacity:0;transform:translate(-50%,30px)} to{opacity:1;transform:translate(-50%,0)} }

        /* Hamburger menü overlay */
        .menu-overlay { position:fixed;inset:0;z-index:9990;background:rgba(0,0,0,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;justify-content:center; }
        .menu-item-enter { animation:menuFade 0.4s cubic-bezier(0.16,1,0.3,1) forwards; }
        @keyframes menuFade { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

        /* Infinite Slider */
        .slider-container { display:flex;height:100vh;overflow:hidden;position:relative;background:#000; }
        .slider-project-list { flex:1;position:relative;overflow:hidden; }
        .slider-project { position:absolute;width:100%;height:100%;left:0;will-change:transform;overflow:hidden; }
        .slider-project img { width:100%;height:100%;object-fit:cover;will-change:transform; }
        .slider-minimap { width:320px;height:100%;border-left:1px solid rgba(225,224,204,0.08);display:flex;flex-direction:column;background:#050505; }
        .slider-minimap-wrapper { display:flex;flex-direction:column;height:100%; }
        .slider-minimap-preview { height:250px;position:relative;overflow:hidden; }
        .slider-minimap-img { position:absolute;width:100%;height:100%;will-change:transform;overflow:hidden; }
        .slider-minimap-img img { width:100%;height:100%;object-fit:cover;will-change:transform; }
        .slider-minimap-info-list { flex:1;position:relative;overflow:hidden; }
        .slider-minimap-info { position:absolute;height:250px;will-change:transform;padding:16px 20px;display:flex;flex-direction:column;justify-content:center; }

        /* Slider gezinme okları */
        .slider-nav-btn { width:44px;height:44px;border-radius:50%;border:1px solid rgba(225,224,204,0.15);background:rgba(0,0,0,0.5);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.3s ease;color:#E1E0CC; }
        .slider-nav-btn:hover { background:rgba(225,224,204,0.1);border-color:rgba(225,224,204,0.3); }

        /* Proje bilgi overlay */
        .slider-info-overlay { position:absolute;bottom:0;left:0;right:0;padding:24px;background:linear-gradient(to top,rgba(0,0,0,0.8) 0%,transparent 100%);z-index:5; }

        @media (max-width:768px) {
            .slider-minimap { display:none; }
            .slider-container { height:70vh; }
        }
        @media (prefers-reduced-motion:reduce) {
            *,*::before,*::after { animation-duration:0.01ms!important;transition-duration:0.01ms!important; }
            .animated-char { opacity:1!important; }
        }
        ::-webkit-scrollbar { width:6px; }
        ::-webkit-scrollbar-track { background:#000; }
        ::-webkit-scrollbar-thumb { background:#333;border-radius:3px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    function cn(...classes) { return classes.filter(Boolean).join(' '); }

    /* =====================================================
       HOOK: useInView
       ===================================================== */
    function useInView(options = {}) {
        const ref = useRef(null);
        const [isInView, setIsInView] = useState(false);
        useEffect(() => {
            const el = ref.current; if (!el) return;
            const observer = new IntersectionObserver(
                ([entry]) => { if (entry.isIntersecting) { setIsInView(true); if (options.once !== false) observer.unobserve(el); } else if (options.once === false) { setIsInView(false); } },
                { threshold: options.threshold || 0, rootMargin: options.margin || '0px' }
            );
            observer.observe(el);
            return () => observer.disconnect();
        }, []);
        return [ref, isInView];
    }

    /* =====================================================
       BİLEŞEN: WordsPullUp
       ===================================================== */
    function WordsPullUp({ text, className = '', showAsterisk = false }) {
        const [ref, isInView] = useInView({ once: true, margin: '-50px' });
        const words = text.split(' ');
        return (
            <span ref={ref} className={cn('inline-flex flex-wrap justify-center', className)}>
                {words.map((word, i) => {
                    const isLast = i === words.length - 1;
                    const delay = i * 0.08;
                    return (
                        <span key={i} className="word-overflow">
                            <span style={{ display:'inline-block', transform:isInView?'translateY(0)':'translateY(110%)', transition:`transform 0.7s cubic-bezier(0.16,1,0.3,1) ${delay}s`, position:'relative' }}>
                                {word}
                                {showAsterisk && isLast && <sup style={{ position:'absolute',top:'0.65em',right:'-0.3em',fontSize:'0.31em',fontWeight:'normal' }}>*</sup>}
                            </span>
                        </span>
                    );
                })}
            </span>
        );
    }

    /* =====================================================
       BİLEŞEN: WordsPullUpMultiStyle
       ===================================================== */
    function WordsPullUpMultiStyle({ segments, className = '' }) {
        const [ref, isInView] = useInView({ once: true, margin: '-50px' });
        const allWords = [];
        segments.forEach((seg, si) => { seg.text.split(' ').forEach((w, wi) => { allWords.push({ word:w, className:seg.className||'', key:`${si}-${wi}` }); }); });
        return (
            <span ref={ref} className={cn('inline-flex flex-wrap justify-center', className)}>
                {allWords.map((item, i) => (
                    <span key={item.key} className="word-overflow">
                        <span className={item.className} style={{ display:'inline-block', transform:isInView?'translateY(0)':'translateY(110%)', transition:`transform 0.7s cubic-bezier(0.16,1,0.3,1) ${i*0.08}s` }}>{item.word}</span>
                    </span>
                ))}
            </span>
        );
    }

    /* =====================================================
       BİLEŞEN: AnimatedText (scroll reveal)
       ===================================================== */
    function AnimatedLetter({ char, index, totalChars, scrollProgress }) {
        const cp = index / totalChars; const rs = cp - 0.1; const re = cp + 0.05;
        let o = 0.2;
        if (scrollProgress <= rs) o = 0.2; else if (scrollProgress >= re) o = 1; else { o = 0.2 + ((scrollProgress - rs) / (re - rs)) * 0.8; }
        return <span className="animated-char" style={{ opacity:o, transition:'opacity 0.05s ease' }}>{char}</span>;
    }
    function AnimatedText({ text, className = '' }) {
        const ref = useRef(null); const [progress, setProgress] = useState(0);
        useEffect(() => {
            const el = ref.current; if (!el) return;
            const handle = () => { const r = el.getBoundingClientRect(); const vh = window.innerHeight; setProgress(Math.min(1, Math.max(0, (vh*0.8-r.top)/(vh*0.8-vh*0.2)))); };
            window.addEventListener('scroll', handle, { passive:true }); handle();
            return () => window.removeEventListener('scroll', handle);
        }, []);
        const chars = text.split('');
        return <p ref={ref} className={className}>{chars.map((c,i) => <AnimatedLetter key={i} char={c} index={i} totalChars={chars.length} scrollProgress={progress} />)}</p>;
    }

    /* =====================================================
       BİLEŞEN: FadeUp + CardEntrance
       ===================================================== */
    function FadeUp({ children, delay=0, className='' }) {
        const [ref, iv] = useInView({ once:true, margin:'-50px' });
        return <div ref={ref} className={className} style={{ opacity:iv?1:0, transform:iv?'translateY(0)':'translateY(20px)', transition:`opacity 0.7s cubic-bezier(0.16,1,0.3,1) ${delay}s, transform 0.7s cubic-bezier(0.16,1,0.3,1) ${delay}s` }}>{children}</div>;
    }
    function CardEntrance({ children, delay=0, className='' }) {
        const [ref, iv] = useInView({ once:true, margin:'-100px' });
        return <div ref={ref} className={className} style={{ opacity:iv?1:0, transform:iv?'scale(1)':'scale(0.95)', transition:`opacity 0.7s cubic-bezier(0.22,1,0.36,1) ${delay}s, transform 0.7s cubic-bezier(0.22,1,0.36,1) ${delay}s` }}>{children}</div>;
    }

    /* =====================================================
       İKONLAR (lucide-react tarzı inline SVG)
       ===================================================== */
    function ArrowRight({ size=18, className='' }) {
        return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>;
    }
    function Check({ size=16, className='' }) {
        return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>;
    }
    function XIcon({ size=20, className='' }) {
        return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
    }
    function CookieIcon({ size=24, className='' }) {
        return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"/><path d="M8.5 8.5v.01"/><path d="M16 15.5v.01"/><path d="M12 12v.01"/><path d="M11 17v.01"/><path d="M7 14v.01"/></svg>;
    }
    function MenuIcon({ size=24, className='' }) {
        return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>;
    }
    function MapPin({ size=18, className='' }) {
        return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
    }
    function Phone({ size=18, className='' }) {
        return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>;
    }
    function Mail({ size=18, className='' }) {
        return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>;
    }
    function ChevronUp({ size=20, className='' }) {
        return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m18 15-6-6-6 6"/></svg>;
    }
    function ChevronDown({ size=20, className='' }) {
        return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>;
    }
    function Heart({ size=18, className='' }) {
        return <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>;
    }

    /* =====================================================
       BİLEŞEN: HamburgerMenu (mobil menü)
       ===================================================== */
    function HamburgerMenu({ isOpen, onClose }) {
        if (!isOpen) return null;
        const links = [
            { href:'#hero', label:'Ana Sayfa' },
            { href:'#about', label:'Hikayemiz' },
            { href:'#gallery', label:'Galeri' },
            { href:'#features', label:'Çalışmalarımız' },
            { href:'#contact', label:'İletişim' }
        ];
        return (
            <div className="menu-overlay" onClick={onClose}>
                <button onClick={onClose} className="absolute top-6 right-6 text-[#E1E0CC] p-2" aria-label="Menüyü kapat">
                    <XIcon size={28} />
                </button>
                <nav className="flex flex-col items-center gap-6" role="navigation" aria-label="Mobil menü">
                    {links.map((link, i) => (
                        <a key={link.href} href={link.href} onClick={onClose}
                           className="menu-item-enter text-2xl sm:text-3xl font-light tracking-wide hover:text-[#DEDBC8] transition-colors"
                           style={{ color:'rgba(225,224,204,0.8)', animationDelay:`${i * 0.08}s` }}>
                            {link.label}
                        </a>
                    ))}
                </nav>
                <div className="mt-12 flex items-center gap-4 text-gray-500 text-sm">
                    <MapPin size={14} /> <span>Sıhana Jorin Köyü</span>
                </div>
            </div>
        );
    }

    /* =====================================================
       BİLEŞEN: CookieBanner
       ===================================================== */
    function CookieBanner() {
        const [isVisible, setIsVisible] = useState(false);
        const [isClosing, setIsClosing] = useState(false);
        useEffect(() => {
            const a = localStorage.getItem('sj-cookies');
            if (!a) { const t = setTimeout(() => setIsVisible(true), 2500); return () => clearTimeout(t); }
        }, []);
        const close = () => { setIsClosing(true); setTimeout(() => setIsVisible(false), 400); };
        const accept = () => { localStorage.setItem('sj-cookies','true'); close(); };
        const decline = () => { localStorage.setItem('sj-cookies','declined'); close(); };
        if (!isVisible) return null;
        return (
            <div className={cn('fixed bottom-4 right-4 sm:bottom-6 sm:right-6 z-[9990] max-w-[calc(100vw-2rem)] sm:max-w-none', isClosing?'cookie-exit':'cookie-enter')} role="dialog" aria-label="Çerez bildirimi">
                <div className="bg-[#101010] border border-[#DEDBC8]/20 rounded-2xl p-5 sm:p-6 sm:w-80 shadow-2xl">
                    <div className="flex items-start gap-3 mb-3">
                        <div className="w-10 h-10 rounded-full bg-[#DEDBC8]/10 flex items-center justify-center shrink-0"><CookieIcon size={20} className="text-[#DEDBC8]" /></div>
                        <h3 className="text-[#E1E0CC] text-base font-medium leading-snug">Gizliliğiniz bizim için önemli</h3>
                    </div>
                    <p className="text-gray-400 text-sm leading-relaxed mb-5">
                        Sitemiz, deneyiminizi iyileştirmek için çerezleri kullanmaktadır. Daha fazla bilgi için <a href="#" className="text-[#DEDBC8] underline hover:no-underline">Gizlilik Politikamızı</a> inceleyebilirsiniz.
                    </p>
                    <div className="flex items-center justify-between gap-3">
                        <a href="#" className="text-[#DEDBC8]/60 underline text-sm hover:text-[#DEDBC8] transition-colors shrink-0">Seçenekler</a>
                        <div className="flex gap-2">
                            <button onClick={decline} className="px-4 py-2 border border-[#DEDBC8]/20 rounded-full text-gray-400 text-sm hover:border-[#DEDBC8]/40 hover:text-[#DEDBC8] active:scale-95 transition-all">Reddet</button>
                            <button onClick={accept} className="px-4 py-2 bg-[#DEDBC8] rounded-full text-black text-sm font-medium active:scale-95 transition-all hover:bg-[#E8E5D4]">Kabul Et</button>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    /* =====================================================
       BİLEŞEN: CircleProgress (TOC ilerleme)
       ===================================================== */
    function CircleProgress({ percentage }) {
        const s=24, sw=2.5, r=(s-sw)/2, c=2*Math.PI*r, o=c-(percentage/100)*c;
        return (
            <svg width={s} height={s} className="-rotate-90 shrink-0">
                <circle cx={s/2} cy={s/2} r={r} fill="none" stroke="var(--muted)" strokeWidth={sw} />
                <circle cx={s/2} cy={s/2} r={r} fill="none" stroke="var(--foreground)" strokeWidth={sw} strokeDasharray={c} strokeDashoffset={o} strokeLinecap="round" style={{ transition:'stroke-dashoffset 0.15s ease-out' }} />
            </svg>
        );
    }

    /* =====================================================
       BİLEŞEN: DynamicIslandTOC
       ===================================================== */
    function DynamicIslandTOC() {
        const [headings, setHeadings] = useState([]);
        const [activeId, setActiveId] = useState(null);
        const [hoveredId, setHoveredId] = useState(null);
        const [isExpanded, setIsExpanded] = useState(false);
        const [progress, setProgress] = useState(0);
        const [isVisible, setIsVisible] = useState(false);

        useEffect(() => {
            const h = () => setIsVisible(window.scrollY > window.innerHeight * 0.5);
            window.addEventListener('scroll', h, { passive:true }); h();
            return () => window.removeEventListener('scroll', h);
        }, []);

        useEffect(() => {
            const getHeadings = () => {
                const els = Array.from(document.querySelectorAll('[data-toc]'));
                const valid = els.filter(el => !el.hasAttribute('data-toc-ignore')).map((el, idx) => {
                    if (!el.id) { el.id = el.textContent?.toLowerCase().replace(/\s+/g,'-').replace(/[^\w-]/g,'') || `toc-${idx}`; }
                    const da = el.getAttribute('data-toc-depth'); let level = 2;
                    if (da) { level = parseInt(da, 10); } else { const t = el.tagName.toUpperCase(); if (t.startsWith('H')&&t.length===2) level = parseInt(t[1], 10); }
                    return { id:el.id, text:el.getAttribute('data-toc-title')||el.textContent||'Bölüm', level, element:el };
                });
                valid.sort((a,b) => a.element.compareDocumentPosition(b.element) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1);
                setHeadings(valid);
            };
            const t = setTimeout(getHeadings, 300);
            return () => clearTimeout(t);
        }, []);

        useEffect(() => {
            const handle = () => {
                let cur = null;
                for (const h of headings) { if (h.element.getBoundingClientRect().top <= 120) cur = h.id; else break; }
                if (!cur && headings.length > 0) cur = headings[0].id;
                setActiveId(cur);
                const tot = document.documentElement.scrollHeight - window.innerHeight;
                setProgress(tot > 0 ? Math.min(100, Math.max(0, (window.scrollY/tot)*100)) : 0);
            };
            window.addEventListener('scroll', handle, { passive:true }); handle();
            return () => window.removeEventListener('scroll', handle);
        }, [headings]);

        const activeHeading = headings.find(h => h.id === activeId);

    /* =====================================================
       BİLEŞEN: InfiniteSlider
       argent-loop-infinite-slider'dan uyarlandı
       ===================================================== */
    const SLIDER_DATA = [
        { title:"Yaz Şenliği 2024", image:"https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=1920&auto=format&fit=crop", category:"Kültürel Etkinlik", year:"2024", description:"Köyün geleneksel yaz festivali" },
        { title:"El Sanatları Atölyesi", image:"https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=1920&auto=format&fit=crop", category:"Atölye Çalışması", year:"2024", description:"Geleneksel el sanatları eğitim programı" },
        { title:"Doğa Yürüyüşü", image:"https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1920&auto=format&fit=crop", category:"Doğa Aktivitesi", year:"2024", description:"Köy çevresinde doğa yürüyüşleri" },
        { title:"Bağ Bozumu Festivali", image:"https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=1920&auto=format&fit=crop", category:"Tarım Projesi", year:"2023", description:"Geleneksel bağ bozumu kutlamaları" },
        { title:"Kış Toplantısı", image:"https://images.unsplash.com/photo-1469474968028-56623f02e42e?q=80&w=1920&auto=format&fit=crop", category:"Topluluk Buluşması", year:"2023", description:"Yıllık kış toplantısı ve değerlendirme" },
    ];

    const SLIDER_CONFIG = { SCROLL_SPEED:0.75, LERP_FACTOR:0.05, BUFFER_SIZE:5, MAX_VELOCITY:150, SNAP_DURATION:500, MINIMAP_HEIGHT:250 };

    function InfiniteSlider() {
        const [visibleRange, setVisibleRange] = useState({ min:-SLIDER_CONFIG.BUFFER_SIZE, max:SLIDER_CONFIG.BUFFER_SIZE });
        const containerRef = useRef(null);
        const state = useRef({ currentY:0, targetY:0, isDragging:false, isSnapping:false, snapStart:{time:0,y:0,target:0}, lastScrollTime:Date.now(), dragStart:{y:0,scrollY:0}, projectHeight:0 });
        const projectsRef = useRef(new Map());
        const minimapRef = useRef(new Map());
        const infoRef = useRef(new Map());
        const requestRef = useRef();
        const renderedRange = useRef({ min:-SLIDER_CONFIG.BUFFER_SIZE, max:SLIDER_CONFIG.BUFFER_SIZE });
        const [currentIndex, setCurrentIndex] = useState(0);

        const lerp = (s, e, f) => s + (e - s) * f;
        const getData = (i) => SLIDER_DATA[((Math.abs(i) % SLIDER_DATA.length) + SLIDER_DATA.length) % SLIDER_DATA.length];
        const getNum = (i) => (((Math.abs(i) % SLIDER_DATA.length) + SLIDER_DATA.length) % SLIDER_DATA.length + 1).toString().padStart(2,'0');

        const updateParallax = (img, scroll, index, height) => {
            if (!img) return;
            if (!img.dataset.pc) img.dataset.pc = '0';
            let cur = parseFloat(img.dataset.pc);
            const tgt = (-scroll - index * height) * 0.2;
            cur = lerp(cur, tgt, 0.1);
            if (Math.abs(cur - tgt) > 0.01) {
                img.style.transform = `translateY(${cur}px) scale(1.5)`;
                img.dataset.pc = cur.toString();
            }
        };

        const snapToProject = () => {
            const s = state.current;
            const cur = Math.round(-s.targetY / s.projectHeight);
            s.isSnapping = true;
            s.snapStart = { time:Date.now(), y:s.targetY, target:-cur * s.projectHeight };
        };

        const updatePositions = () => {
            const s = state.current;
            const mmY = (s.currentY * SLIDER_CONFIG.MINIMAP_HEIGHT) / s.projectHeight;
            projectsRef.current.forEach((el, i) => {
                el.style.transform = `translateY(${i * s.projectHeight + s.currentY}px)`;
                updateParallax(el.querySelector('img'), s.currentY, i, s.projectHeight);
            });
            minimapRef.current.forEach((el, i) => {
                el.style.transform = `translateY(${i * SLIDER_CONFIG.MINIMAP_HEIGHT + mmY}px)`;
                updateParallax(el.querySelector('img'), mmY, i, SLIDER_CONFIG.MINIMAP_HEIGHT);
            });
            infoRef.current.forEach((el, i) => {
                el.style.transform = `translateY(${i * SLIDER_CONFIG.MINIMAP_HEIGHT + mmY}px)`;
            });
        };

        const animate = () => {
            const s = state.current;
            const now = Date.now();
            if (!s.isSnapping && !s.isDragging && now - s.lastScrollTime > 100) {
                const sp = -Math.round(-s.targetY / s.projectHeight) * s.projectHeight;
                if (Math.abs(s.targetY - sp) > 1) snapToProject();
            }
            if (s.isSnapping) {
                const prog = Math.min((Date.now() - s.snapStart.time) / SLIDER_CONFIG.SNAP_DURATION, 1);
                const eased = 1 - Math.pow(1 - prog, 3);
                s.targetY = s.snapStart.y + (s.snapStart.target - s.snapStart.y) * eased;
                if (prog >= 1) s.isSnapping = false;
            }
            if (!s.isDragging) s.currentY += (s.targetY - s.currentY) * SLIDER_CONFIG.LERP_FACTOR;
            updatePositions();

            const ci = Math.round(-s.targetY / s.projectHeight);
            setCurrentIndex(ci);
            const min = ci - SLIDER_CONFIG.BUFFER_SIZE, max = ci + SLIDER_CONFIG.BUFFER_SIZE;
            if (min !== renderedRange.current.min || max !== renderedRange.current.max) {
                renderedRange.current = { min, max };
                setVisibleRange({ min, max });
            }
        };

        const goToProject = (dir) => {
            const s = state.current;
            const cur = Math.round(-s.targetY / s.projectHeight);
            const next = cur + dir;
            s.isSnapping = true;
            s.snapStart = { time:Date.now(), y:s.targetY, target:-next * s.projectHeight };
        };

        useEffect(() => {
            const container = containerRef.current;
            if (!container) return;

            state.current.projectHeight = container.offsetHeight;

            const onWheel = (e) => {
                e.preventDefault();
                const s = state.current;
                s.isSnapping = false;
                s.lastScrollTime = Date.now();
                const delta = Math.max(Math.min(e.deltaY * SLIDER_CONFIG.SCROLL_SPEED, SLIDER_CONFIG.MAX_VELOCITY), -SLIDER_CONFIG.MAX_VELOCITY);
                s.targetY -= delta;
            };

            const onTS = (e) => { const s = state.current; s.isDragging=true; s.isSnapping=false; s.dragStart={y:e.touches[0].clientY,scrollY:s.targetY}; s.lastScrollTime=Date.now(); };
            const onTM = (e) => { const s = state.current; if (!s.isDragging) return; s.targetY=s.dragStart.scrollY+(e.touches[0].clientY-s.dragStart.y)*1.5; s.lastScrollTime=Date.now(); };
            const onTE = () => { state.current.isDragging=false; };
            const onResize = () => { state.current.projectHeight=container.offsetHeight; };

            container.addEventListener('wheel', onWheel, { passive:false });
            container.addEventListener('touchstart', onTS, { passive:true });
            container.addEventListener('touchmove', onTM, { passive:true });
            container.addEventListener('touchend', onTE);
            window.addEventListener('resize', onResize);
            onResize();

            const loop = () => { animate(); requestRef.current = requestAnimationFrame(loop); };
            requestRef.current = requestAnimationFrame(loop);

            return () => {
                container.removeEventListener('wheel', onWheel);
                container.removeEventListener('touchstart', onTS);
                container.removeEventListener('touchmove', onTM);
                container.removeEventListener('touchend', onTE);
                window.removeEventListener('resize', onResize);
                if (requestRef.current) cancelAnimationFrame(requestRef.current);
            };
        }, []);

        const indices = [];
        for (let i = visibleRange.min; i <= visibleRange.max; i++) indices.push(i);

        const displayIndex = ((Math.abs(currentIndex) % SLIDER_DATA.length) + SLIDER_DATA.length) % SLIDER_DATA.length + 1;

        return (
            <div ref={containerRef} className="slider-container" style={{ cursor: state.current.isDragging ? 'grabbing' : 'default' }}>
                {/* Büyük proje görselleri */}
                <ul className="slider-project-list">
                    {indices.map(i => {
                        const d = getData(i);
                        return (
                            <div key={i} className="slider-project" ref={el => { if (el) projectsRef.current.set(i,el); else projectsRef.current.delete(i); }}>
                                <img src={d.image} alt={d.title} loading="lazy" />
                                {/* Mobilde bilgi overlay */}
                                <div className="slider-info-overlay md:hidden">
                                    <span className="text-[10px] text-[#DEDBC8]/60 tracking-widest uppercase">{d.category} — {d.year}</span>
                                    <h3 className="text-xl font-medium mt-1" style={{ color:'#E1E0CC' }}>{d.title}</h3>
                                    <p className="text-gray-400 text-xs mt-1">{d.description}</p>
                                </div>
                            </div>
                        );
                    })}
                </ul>

                {/* Sağ panel — Minimap + Bilgi */}
                <div className="slider-minimap hidden md:flex">
                    <div className="slider-minimap-wrapper">
                        {/* Küçük görsel önizleme */}
                        <div className="slider-minimap-preview">
                            {indices.map(i => {
                                const d = getData(i);
                                return (
                                    <div key={i} className="slider-minimap-img" ref={el => { if (el) minimapRef.current.set(i,el); else minimapRef.current.delete(i); }}>
                                        <img src={d.image} alt={d.title} loading="lazy" />
                                    </div>
                                );
                            })}
                        </div>
                        {/* Proje bilgileri */}
                        <div className="slider-minimap-info-list">
                            {indices.map(i => {
                                const d = getData(i); const n = getNum(i);
                                return (
                                    <div key={i} className="slider-minimap-info" ref={el => { if (el) infoRef.current.set(i,el); else infoRef.current.delete(i); }}>
                                        <div className="flex justify-between items-start mb-2">
                                            <span className="text-[#DEDBC8]/40 text-xs font-mono">{n}</span>
                                            <span className="text-[#DEDBC8]/40 text-xs">{d.year}</span>
                                        </div>
                                        <h4 className="text-base font-medium mb-1" style={{ color:'#E1E0CC' }}>{d.title}</h4>
                                        <span className="text-[10px] text-[#DEDBC8]/50 tracking-widest uppercase">{d.category}</span>
                                        <p className="text-gray-500 text-xs mt-3">{d.description}</p>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>

                {/* Gezinme okları */}
                <div className="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 flex items-center gap-3">
                    <button onClick={() => goToProject(-1)} className="slider-nav-btn" aria-label="Önceki">
                        <ChevronUp size={18} />
                    </button>
                    <span className="text-xs text-[#DEDBC8]/40 font-mono w-12 text-center">{displayIndex.toString().padStart(2,'0')} / {SLIDER_DATA.length.toString().padStart(2,'0')}</span>
                    <button onClick={() => goToProject(1)} className="slider-nav-btn" aria-label="Sonraki">
                        <ChevronDown size={18} />
                    </button>
                </div>

                {/* Kaydırma ipucu */}
                <div className="absolute top-4 left-1/2 -translate-x-1/2 z-10 text-[10px] text-[#DEDBC8]/30 tracking-widest uppercase hidden md:block">
                    Kaydırarak gezin
                </div>
            </div>
        );
    }
