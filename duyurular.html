<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duyurular — Sıhana Jorin Köy Derneği</title>
    <meta name="description"
        content="Sıhana Jorin Köy Derneği'nin en güncel haberleri, etkinlik duyuruları ve önemli gelişmeleri.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>window.tailwind = window.tailwind || {}; window.tailwind.config = { theme: { extend: { colors: { primary: '#DEDBC8' }, fontFamily: { serif: ['"Instrument Serif"', 'serif'] } } } }</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .duy-timeline {
            position: relative;
            padding-left: 1.5rem;
        }

        @media (min-width: 768px) {
            .duy-timeline {
                padding-left: 0;
            }
        }

        .duy-line {
            position: absolute;
            left: 5px;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(222, 219, 200, 0.08);
        }

        @media (min-width: 768px) {
            .duy-line {
                left: 50%;
                transform: translateX(-50%);
            }
        }

        .duy-item {
            position: relative;
            margin-bottom: 3rem;
        }

        @media (min-width: 768px) {
            .duy-item {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0;
                align-items: start;
            }

            .duy-item:nth-child(odd) {}

            .duy-item:nth-child(odd) .duy-date-col {
                text-align: right;
                padding-right: 2.5rem;
                order: -1;
            }

            .duy-item:nth-child(odd) .duy-content-col {
                padding-left: 2.5rem;
            }

            .duy-item:nth-child(even) .duy-date-col {
                text-align: left;
                padding-left: 2.5rem;
                order: 1;
            }

            .duy-item:nth-child(even) .duy-content-col {
                padding-right: 2.5rem;
                order: -1;
                text-align: right;
            }

            .duy-item:nth-child(even) .duy-content-col .duy-card {
                text-align: left;
            }
        }

        .duy-dot {
            position: absolute;
            left: -24px;
            top: 6px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #DEDBC8;
            border: 3px solid #000;
            z-index: 1;
            flex-shrink: 0;
        }

        .duy-dot--dim {
            background: rgba(222, 219, 200, 0.25);
        }

        @media (min-width: 768px) {
            .duy-dot {
                left: 50%;
                transform: translateX(-50%);
                top: 8px;
            }
        }

        .duy-date {
            font-size: 0.75rem;
            color: rgba(222, 219, 200, 0.3);
            letter-spacing: 0.04em;
            padding-top: 0.5rem;
        }

        .duy-card {
            background: #111;
            border: 1px solid rgba(222, 219, 200, 0.07);
            border-radius: 1.25rem;
            padding: 1.75rem 2rem;
            transition: border-color 0.3s;
        }

        .duy-card:hover {
            border-color: rgba(222, 219, 200, 0.14);
        }

        .duy-cat {
            font-size: 0.625rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(222, 219, 200, 0.3);
            margin-bottom: 0.625rem;
        }

        .duy-title {
            font-size: 1.0625rem;
            font-weight: 500;
            color: #E1E0CC;
            margin: 0 0 0.75rem;
        }

        .duy-body {
            font-size: 0.875rem;
            color: rgba(222, 219, 200, 0.45);
            line-height: 1.7;
            margin: 0 0 1.125rem;
        }
    </style>
</head>

<body>
    <div id="site-nav"></div>
    <script src="js/site-nav.js"></script>
    <script src="js/hooks.js"></script>
    <script src="js/components/page-header.js"></script>
    <script type="text/babel" src="js/components/carousel-card.js"></script>
    <script src="js/animations-init.js"></script>

    <main>
        <div id="page-header-root"></div>
        <div id="duyurular-root" class="max-w-[95%] xl:max-w-7xl mx-auto py-12"></div>

        <script type="text/babel">
            (function () {
                const headerRoot = ReactDOM.createRoot(document.getElementById('page-header-root'));
                headerRoot.render(React.createElement(SJ.PageHeader, {
                    title: 'Duyurular',
                    description: 'Köy derneğimizin en güncel haberleri, etkinlik duyuruları ve önemli gelişmelerden haberdar olun.'
                }));

                const ANNOUNCEMENTS_DATA = [
                    {
                        id: 1,
                        date: 'Ağustos 2026',
                        category: 'Etkinlik · Duyuru',
                        title: 'Geleneksel Yaz Şenliği',
                        imgUrl: 'https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?auto=compress&cs=tinysrgb&w=800',
                        content: 'Bu yıl geleneksel Yaz Şenliğimiz 15–16 Ağustos tarihlerinde köy meydanında gerçekleşecektir.\n\nŞenliğimizde canlı müzik performansları, halk oyunları gösterileri, yöresel yemek stantları ve çocuklar için özel oyun alanları bulunacaktır. Tüm köy halkımız, çevre köylerdeki komşularımız ve gurbetteki tüm hemşehrilerimiz davetlidir.'
                    },
                    {
                        id: 2,
                        date: 'Haziran 2026',
                        category: 'Altyapı · Çalışma',
                        title: 'Köy Yolu Yenileme Çalışmaları',
                        imgUrl: 'https://images.unsplash.com/photo-1541888946425-d81bb19240f5?auto=compress&cs=tinysrgb&w=800',
                        content: 'Köyümüzün ana bağlantı yolunda derneğimizin girişimleri ve belediye iş birliğiyle yürütülen genişletme ve asfaltlama çalışmaları başarıyla tamamlanmıştır.\n\nArtık köyümüze ulaşım çok daha konforlu ve güvenli. Desteklerini esirgemeyen tüm köylülerimize teşekkürü bir borç biliriz.'
                    },
                    {
                        id: 3,
                        date: 'Mayıs 2026',
                        category: 'Topluluk · Eğitim',
                        title: 'Yeni Dönem Üye Kayıtları',
                        imgUrl: 'https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=compress&cs=tinysrgb&w=800',
                        content: 'Sıhana Jorin Köy Derneği 2026–2027 dönemi üyelik yenileme ve yeni üye kayıt süreci başlamıştır.\n\nKöyümüzün geleceğini şekillendirmek, projelerimizde aktif söz sahibi olmak ve dayanışmayı büyütmek adına tüm gençlerimizi ve hemşehrilerimizi derneğimize resmi üye olmaya davet ediyoruz.'
                    },
                    {
                        id: 4,
                        date: 'Nisan 2026',
                        category: 'Kültür · Sanat',
                        title: 'Köy El Sanatları Sergisi',
                        imgUrl: 'https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=compress&cs=tinysrgb&w=800',
                        content: 'Köyümüzün kadınları tarafından hazırlanan el emeği göz nuru dokumalar, seramikler ve geleneksel süs eşyalarının sergileneceği özel sergimiz açılmıştır.\n\nDernek binamızın sergi salonunda bir ay boyunca açık kalacak olan sergimizi ziyaret edebilir, hem tarihimize dokunabilir hem de el emeğine destek olabilirsiniz.'
                    }
                ];

                const carouselRoot = ReactDOM.createRoot(document.getElementById('duyurular-root'));
                carouselRoot.render(React.createElement(SJ.CarouselCard, {
                    data: ANNOUNCEMENTS_DATA,
                    showCarousel: true
                }));
            })();
        </script>
    </main>

    <div id="site-footer"></div>
</body>

</html>
