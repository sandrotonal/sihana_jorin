<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duyurular — Sıhana Jorin Köy Derneği</title>
    <meta name="description"
        content="Sıhana Jorin Köy Derneği'nin en güncel haberleri, etkinlik duyuruları ve önemli gelişmeleri.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>window.tailwind = window.tailwind || {}; window.tailwind.config = { theme: { extend: { colors: { primary: '#DEDBC8' }, fontFamily: { serif: ['"Instrument Serif"', 'serif'] } } } }</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .duy-timeline {
            position: relative;
            padding-left: 1.5rem;
        }

        @media (min-width: 768px) {
            .duy-timeline {
                padding-left: 0;
            }
        }

        .duy-line {
            position: absolute;
            left: 5px;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(222, 219, 200, 0.08);
        }

        @media (min-width: 768px) {
            .duy-line {
                left: 50%;
                transform: translateX(-50%);
            }
        }

        .duy-item {
            position: relative;
            margin-bottom: 3rem;
        }

        @media (min-width: 768px) {
            .duy-item {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0;
                align-items: start;
            }

            .duy-item:nth-child(odd) {}

            .duy-item:nth-child(odd) .duy-date-col {
                text-align: right;
                padding-right: 2.5rem;
                order: -1;
            }

            .duy-item:nth-child(odd) .duy-content-col {
                padding-left: 2.5rem;
            }

            .duy-item:nth-child(even) .duy-date-col {
                text-align: left;
                padding-left: 2.5rem;
                order: 1;
            }

            .duy-item:nth-child(even) .duy-content-col {
                padding-right: 2.5rem;
                order: -1;
                text-align: right;
            }

            .duy-item:nth-child(even) .duy-content-col .duy-card {
                text-align: left;
            }
        }

        .duy-dot {
            position: absolute;
            left: -24px;
            top: 6px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #DEDBC8;
            border: 3px solid #000;
            z-index: 1;
            flex-shrink: 0;
        }

        .duy-dot--dim {
            background: rgba(222, 219, 200, 0.25);
        }

        @media (min-width: 768px) {
            .duy-dot {
                left: 50%;
                transform: translateX(-50%);
                top: 8px;
            }
        }

        .duy-date {
            font-size: 0.75rem;
            color: rgba(222, 219, 200, 0.3);
            letter-spacing: 0.04em;
            padding-top: 0.5rem;
        }

        .duy-card {
            background: #111;
            border: 1px solid rgba(222, 219, 200, 0.07);
            border-radius: 1.25rem;
            padding: 1.75rem 2rem;
            transition: border-color 0.3s;
        }

        .duy-card:hover {
            border-color: rgba(222, 219, 200, 0.14);
        }

        .duy-cat {
            font-size: 0.625rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(222, 219, 200, 0.3);
            margin-bottom: 0.625rem;
        }

        .duy-title {
            font-size: 1.0625rem;
            font-weight: 500;
            color: #E1E0CC;
            margin: 0 0 0.75rem;
        }

        .duy-body {
            font-size: 0.875rem;
            color: rgba(222, 219, 200, 0.45);
            line-height: 1.7;
            margin: 0 0 1.125rem;
        }
    </style>
</head>

<body class="flex flex-col min-h-screen">
    <div id="site-nav"></div>
    <script src="js/site-nav.js"></script>
    <script src="js/hooks.js"></script>
    <script src="js/components/page-header.js"></script>
    <script src="js/components/carousel-card.js"></script>
    <script src="js/data/announcements.js"></script>
    <script src="js/animations-init.js"></script>

    <main class="flex-grow pt-12">
        <div id="page-header-root"></div>
        <div id="duyurular-root" class="max-w-[95%] xl:max-w-7xl mx-auto py-12 pb-16"></div>

        <script type="text/babel">
            (function () {
                const headerRoot = ReactDOM.createRoot(document.getElementById('page-header-root'));
                headerRoot.render(React.createElement(SJ.PageHeader, {
                    title: 'Duyurular',
                    description: 'Köy derneğimizin en güncel haberleri, etkinlik duyuruları ve önemli gelişmelerden haberdar olun.'
                }));

                // Map shared SJ.DUYURULAR_DATA to CarouselCard format
                const carouselData = (window.SJ.DUYURULAR_DATA || []).map(function(item) {
                    return {
                        id: item.id,
                        imgUrl: item.imgUrl,
                        content: [
                            '<div class="flex items-center justify-between border-b border-[#DEDBC8]/10 pb-2 mb-3 text-[10px] tracking-wider uppercase text-[#DEDBC8]/60 font-sans">',
                            '  <span>' + item.category + ' · ' + item.subCategory + '</span>',
                            '  <span>' + item.date + '</span>',
                            '</div>',
                            '<h4 class="text-base font-semibold text-primary mb-2">' + item.title + '</h4>',
                            '<span class="text-xs text-gray-300 leading-relaxed block">' + item.description + '</span>'
                        ].join('')
                    };
                });

                const carouselRoot = ReactDOM.createRoot(document.getElementById('duyurular-root'));
                carouselRoot.render(React.createElement(SJ.CarouselCard, {
                    data: carouselData,
                    showCarousel: true
                }));
            })();
        </script>
    </main>

    <div id="site-footer"></div>
</body>

</html>
