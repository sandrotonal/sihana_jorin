<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim — Sıhana Jorin Köy Derneği</title>
    <meta name="description"
        content="Sıhana Jorin Köy Derneği ile iletişime geçin. Soru, öneri ve görüşleriniz için formumuzu doldurun.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700&family=Instrument+Serif:ital@1&display=swap"
        rel="stylesheet">
    <script>window.tailwind = window.tailwind || {}; window.tailwind.config = { theme: { extend: { colors: { primary: '#DEDBC8' }, fontFamily: { sans: ['Almarai','sans-serif'], serif: ['"Instrument Serif"', 'serif'] } } } }</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .ilet-info-item {
            padding: 1.5rem 0;
            border-bottom: 1px solid rgba(222, 219, 200, 0.06);
        }

        .ilet-info-item:last-child {
            border-bottom: none;
        }

        .ilet-info-key {
            font-size: 0.6875rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(222, 219, 200, 0.3);
            margin-bottom: 0.375rem;
            display: block;
        }

        .ilet-info-val {
            font-size: 0.9rem;
            color: #E1E0CC;
        }

        .ilet-info-val a {
            color: #DEDBC8;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .ilet-info-val a:hover {
            opacity: 0.7;
        }

        .ilet-main-grid {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: clamp(2rem, 4vw, 5rem);
            align-items: start;
        }

        @media (max-width:900px) {
            .ilet-main-grid {
                grid-template-columns: 1fr;
            }
        }

        .ilet-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width:480px) {
            .ilet-form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body class="flex flex-col min-h-screen">
    <div id="site-nav"></div>
    <script src="js/site-nav.js"></script>
    <script src="js/data/site.js"></script>
    <script src="js/hooks.js"></script>
    <script src="js/components/page-header.js"></script>
    <script src="js/animations-init.js"></script>

    <main class="flex-grow pt-12">
        <div id="page-header-root"></div>
        <script type="text/babel">
                (function () {
                    const p = (SJ.SITE_DATA && SJ.SITE_DATA.pages && SJ.SITE_DATA.pages.iletisim) || {};
                    const root = ReactDOM.createRoot(document.getElementById('page-header-root'));
                    root.render(React.createElement(SJ.PageHeader, {
                        title: p.title || 'İletişim',
                        description: p.description || ''
                    }));
                })();
        </script>

        <section class="sj-section" data-reveal>
            <div class="sj-container">
                <div class="ilet-main-grid">

                    <!-- Form -->
                    <div>
                        <span class="sj-label">Mesaj Gönder</span>
                        <h2 class="sj-h3" style="margin-bottom:2rem;">Bizimle konuşun</h2>
                        <form style="display:flex; flex-direction:column; gap:1.25rem;" id="iletisim-form">
                            <div class="ilet-form-grid">
                                <div>
                                    <label class="sj-label-text">Adınız</label>
                                    <input type="text" class="sj-input" placeholder="Adınız" id="ilet-ad">
                                </div>
                                <div>
                                    <label class="sj-label-text">Soyadınız</label>
                                    <input type="text" class="sj-input" placeholder="Soyadınız" id="ilet-soyad">
                                </div>
                            </div>
                            <div>
                                <label class="sj-label-text">E-posta</label>
                                <input type="email" class="sj-input" placeholder="ornek@email.com" id="ilet-email">
                            </div>
                            <div>
                                <label class="sj-label-text">Konu</label>
                                <select class="sj-select" id="ilet-konu">
                                    <option style="background:#111">Genel Bilgi</option>
                                    <option style="background:#111">Üyelik</option>
                                    <option style="background:#111">Bağış</option>
                                    <option style="background:#111">Proje Önerisi</option>
                                    <option style="background:#111">Diğer</option>
                                </select>
                            </div>
                            <div>
                                <label class="sj-label-text">Mesajınız</label>
                                <textarea rows="5" class="sj-textarea" placeholder="Mesajınız..."
                                    id="ilet-mesaj"></textarea>
                            </div>
                            <button type="submit" class="sj-btn-primary"
                                style="align-self:flex-start; min-width:180px;">
                                Mesajı Gönder
                            </button>
                        </form>
                    </div>

                    <!-- Bilgiler -->
                    <div>
                        <span class="sj-label">İletişim Bilgileri</span>
                        <h2 class="sj-h3" style="margin-bottom:1.75rem;">Bize ulaşın</h2>
                        <div id="iletisim-info">
                            <div class="ilet-info-item">
                                <span class="ilet-info-key">Adres</span>
                                <p class="ilet-info-val" style="margin:0; line-height:1.6;" id="iletisim-adres"></p>
                            </div>
                            <div class="ilet-info-item">
                                <span class="ilet-info-key">E-posta</span>
                                <p class="ilet-info-val" style="margin:0;" id="iletisim-email"></p>
                            </div>
                            <div class="ilet-info-item">
                                <span class="ilet-info-key">Sosyal Medya</span>
                                <p class="ilet-info-val" style="margin:0 0 0.75rem 0; color:rgba(222,219,200,0.5); font-size:0.875rem; line-height:1.65;" id="iletisim-social-text"></p>
                                <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
                                    <a href="https://instagram.com" target="_blank" rel="noopener" style="display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; background:rgba(222,219,200,0.08); color:#DEDBC8; transition:all 0.2s;" onmouseover="this.style.background='rgba(222,219,200,0.18)'" onmouseout="this.style.background='rgba(222,219,200,0.08)'" aria-label="Instagram"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></a>
                                    <a href="https://facebook.com" target="_blank" rel="noopener" style="display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; background:rgba(222,219,200,0.08); color:#DEDBC8; transition:all 0.2s;" onmouseover="this.style.background='rgba(222,219,200,0.18)'" onmouseout="this.style.background='rgba(222,219,200,0.08)'" aria-label="Facebook"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></a>
                                    <a href="https://youtube.com" target="_blank" rel="noopener" style="display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; background:rgba(222,219,200,0.08); color:#DEDBC8; transition:all 0.2s;" onmouseover="this.style.background='rgba(222,219,200,0.18)'" onmouseout="this.style.background='rgba(222,219,200,0.08)'" aria-label="YouTube"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.94 2C5.12 20 12 20 12 20s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/></svg></a>
                                    <a href="https://x.com" target="_blank" rel="noopener" style="display:flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; background:rgba(222,219,200,0.08); color:#DEDBC8; transition:all 0.2s;" onmouseover="this.style.background='rgba(222,219,200,0.18)'" onmouseout="this.style.background='rgba(222,219,200,0.08)'" aria-label="X (Twitter)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4l6.25 8.5L4 20h2.5l5.5-7.25L17 20h5l-7-9.5L21 4h-2.5l-5.25 7L9 4H4z"/></svg></a>
                                </div>
                            </div>
                            <div class="ilet-info-item">
                                <span class="ilet-info-key">Yanıt Süresi</span>
                                <p class="ilet-info-val" style="margin:0; color:rgba(222,219,200,0.5); font-size:0.875rem;" id="iletisim-response-time"></p>
                            </div>
                        </div>
                        <script>
                            (function() {
                                var p = (SJ.SITE_DATA && SJ.SITE_DATA.pages && SJ.SITE_DATA.pages.iletisim) || {};
                                document.getElementById('iletisim-adres').innerHTML = (p.address || 'Besler Köyü (Sîhana Jorin)<br>Doğubayazıt / Ağrı').replace(/\n/g, '<br>');
                                var email = p.email || 'info@sihanajorin.org';
                                document.getElementById('iletisim-email').innerHTML = '<a href="mailto:' + email + '" style="color:#DEDBC8;text-decoration:none">' + email + '</a>';
                                document.getElementById('iletisim-social-text').textContent = p.socialText || 'Bizi sosyal medyada takip edin.';
                                document.getElementById('iletisim-response-time').textContent = p.responseTime || 'Mesajlarınıza genellikle 1-2 iş günü içinde yanıt veriyoruz.';
                            })();
                        </script>
                    </div>
                </div>
            </div>
        </section>

        <!-- Harita -->
        <section class="sj-section" data-reveal>
            <div class="sj-container">
                <div style="text-align:center; margin-bottom:2rem;">
                    <span class="sj-label">Konum</span>
                    <h2 class="sj-h2">Bizi haritada bulun</h2>
                </div>
                <div
                    style="border-radius:1.5rem; overflow:hidden; border:1px solid rgba(222,219,200,0.08); aspect-ratio:16/9; max-width:900px; margin:0 auto; background:#0a0a0a;">
                    <iframe src="https://maps.google.com/maps?q=39.4549,44.1786&z=14&output=embed"
                        style="width:100%; height:100%; border:0;" allowfullscreen loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade" title="Besler Köyü (Sîhana Jorin) Haritası">
                    </iframe>
                </div>
                <p style="text-align:center; margin-top:1rem; font-size:0.75rem; color:rgba(222,219,200,0.3);">
                    <a href="https://maps.google.com/maps?q=39.4549,44.1786&z=14" target="_blank" rel="noopener"
                        style="color:inherit; text-decoration:underline;">Büyük haritada görüntüle</a>
                </p>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>
</body>

</html>
