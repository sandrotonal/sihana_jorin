<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri — Sıhana Jorin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
    <script>window.tailwind=window.tailwind||{};window.tailwind.config={theme:{extend:{colors:{primary:'#DEDBC8'},fontFamily:{sans:['Almarai','sans-serif'],serif:['"Instrument Serif"','serif']}}}}</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="flex flex-col min-h-screen">
    <div id="site-nav"></div>
    <script src="js/site-nav.js"></script>
    <script src="js/data/gallery.js"></script>
    <script src="js/hooks.js"></script>
    <script src="js/components/page-header.js"></script>
    <script src="js/components/gallery-hover-carousel.js"></script>
    <script src="js/animations-init.js"></script>

    <main class="flex-grow pt-12">
        <div id="page-header-root"></div>
        <script type="text/babel">
            (function() {
                const root = ReactDOM.createRoot(document.getElementById('page-header-root'));
                root.render(React.createElement(SJ.PageHeader, {
                    title: 'Galeri',
                    description: 'Köyümüzün güzelliklerini, etkinliklerimizi ve birlikte geçirdiğimiz anları keşfedin.'
                }));
            })();
        </script>

        <!-- GalleryHoverCarousel Component -->
        <div id="gallery-root" data-reveal></div>
        <script type="text/babel">
            (function() {
                const root = ReactDOM.createRoot(document.getElementById('gallery-root'));
                root.render(React.createElement(SJ.GalleryHoverCarousel, {
                    heading: 'Köyümüzden Kareler'
                }));
            })();
        </script>
    </main>

    <div id="site-footer"></div>
</body>
</html>
